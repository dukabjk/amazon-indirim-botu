name: Amazon Bot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install python-telegram-bot requests
      - run: python bot.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RAINFOREST_KEY: ${{ secrets.RAINFOREST_KEY }}
      - run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add seen.json -f
          git diff --staged --quiet || (git commit -m "fiyat guncelle" && git push)
