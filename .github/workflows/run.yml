name: Amazon Indirim Botu
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4 python-telegram-bot==20.7
      - env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
